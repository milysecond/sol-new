[package]
name = "fair-draw"
version = "0.1.0"
description = "sol.new Fair Draw consumer for MagicBlock Solana VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fair_draw"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
ephemeral-vrf-sdk = { version = "0.3.0", features = ["anchor"] }
