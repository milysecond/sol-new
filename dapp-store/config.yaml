      long_description: |
        sol.new is the fastest full Solana wallet and creator app — Face ID passkeys, no seed phrases, no extensions.

        • Create a wallet in seconds with Face ID / fingerprint
        • Swap any token (Jupiter) with optional sponsored fees
        • Send gifts anyone can claim — even without a wallet yet
        • Stake SOL, request funds, short links, POAP drops
        • Mint tokens & NFTs, multisig, portfolio — one app

        Built for Seeker and the open web. Free to start.
