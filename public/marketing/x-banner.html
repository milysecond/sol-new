<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  .banner {
    width: 1500px;
    height: 500px;
    position: relative;
    overflow: hidden;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(ellipse 700px 480px at 82% 42%, rgba(168, 85, 247, 0.38) 0%, transparent 62%),
      radial-gradient(ellipse 520px 400px at 12% 88%, rgba(217, 70, 239, 0.16) 0%, transparent 55%),
      radial-gradient(ellipse 400px 300px at 48% 10%, rgba(99, 102, 241, 0.14) 0%, transparent 50%),
      linear-gradient(125deg, #07060f 0%, #12081f 42%, #1a0b2e 72%, #0d0618 100%);
    color: #fff;
  }
  /* subtle grid */
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.07;
    background-image:
      linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 90% 80% at 60% 50%, #000 20%, transparent 75%);
  }
  /* soft orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
  }
  .orb-a {
    width: 280px; height: 280px;
    right: -40px; top: -60px;
    background: radial-gradient(circle, rgba(192,132,252,0.45), transparent 70%);
  }
  .orb-b {
    width: 200px; height: 200px;
    right: 220px; bottom: -70px;
    background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%);
  }
  .orb-c {
    width: 140px; height: 140px;
    left: 380px; top: -30px;
    background: radial-gradient(circle, rgba(232,121,249,0.22), transparent 70%);
  }
  /* top accent line */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #7c3aed, #a855f7 40%, #e879f9 75%, #c084fc);
  }
  .content {
    position: absolute;
    /* leave left-bottom clear for avatar (X overlays ~132px circle near bottom-left) */
    left: 420px;
    right: 80px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .logo {
    width: 92px;
    height: 92px;
    border-radius: 22px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 18px 50px rgba(168, 85, 247, 0.35);
  }
  .wordmark {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .wordmark .dot {
    color: #c084fc;
  }
  .tagline {
    font-size: 28px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    letter-spacing: -0.015em;
    max-width: 920px;
    line-height: 1.35;
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 4px;
  }
  .pill {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #ede9fe;
    background: rgba(168, 85, 247, 0.16);
    border: 1px solid rgba(192, 132, 252, 0.35);
    border-radius: 999px;
    padding: 8px 16px;
  }
  .url {
    position: absolute;
    right: 48px;
    bottom: 28px;
    font-size: 18px;
    font-weight: 600;
    color: rgba(216, 180, 254, 0.9);
    letter-spacing: 0.02em;
  }
  /* decorative lightning silhouette far right, very soft */
  .bolt {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    width: 220px;
    height: 320px;
    opacity: 0.08;
    background: linear-gradient(180deg, #e9d5ff, #a855f7);
    clip-path: polygon(55% 0%, 18% 52%, 42% 52%, 30% 100%, 82% 42%, 55% 42%);
  }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="grid"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="top-bar"></div>
    <div class="bolt"></div>
    <div class="content">
      <div class="brand-row">
        <img class="logo" src="../icon-512.png" alt="" />
        <div class="wordmark">sol<span class="dot">.new</span></div>
      </div>
      <div class="tagline">Passkey Solana wallet · gifts · receipts · fair draws</div>
      <div class="pills">
        <span class="pill">Face ID</span>
        <span class="pill">No seed phrase</span>
        <span class="pill">Send · Gift · Pay</span>
        <span class="pill">.sol · .bonk · .skr</span>
      </div>
    </div>
    <div class="url">sol.new</div>
  </div>
</body>
</html>
