<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <defs>
    <radialGradient id="greenGlow" cx="75%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="35%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="candleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Room background -->
  <rect width="480" height="380" fill="#0a0012"/>

  <!-- Back wall -->
  <rect width="480" height="310" fill="#0d0018"/>

  <!-- Floor -->
  <rect y="310" width="480" height="70" fill="#110020"/>
  <line x1="0" y1="310" x2="480" y2="310" stroke="#2d0050" stroke-width="1.5"/>

  <!-- === GREEN CANDLES (right side, shooting up like fire) === -->
  <g filter="url(#candleGlow)">
    <!-- candle bodies (thick bars) + wicks (thin lines above) -->
    <!-- Each candle: body rect + wick line above it -->

    <!-- Far right cluster -->
    <rect x="440" y="40" width="22" height="268" rx="2" fill="#16a34a"/>
    <line x1="451" y1="10" x2="451" y2="42" stroke="#16a34a" stroke-width="2"/>

    <rect x="410" y="65" width="22" height="243" rx="2" fill="#15803d"/>
    <line x1="421" y1="30" x2="421" y2="67" stroke="#15803d" stroke-width="2"/>

    <rect x="380" y="90" width="22" height="218" rx="2" fill="#22c55e"/>
    <line x1="391" y1="55" x2="391" y2="92" stroke="#22c55e" stroke-width="2"/>

    <rect x="350" y="55" width="22" height="253" rx="2" fill="#16a34a"/>
    <line x1="361" y1="18" x2="361" y2="57" stroke="#16a34a" stroke-width="2"/>

    <!-- Middle cluster -->
    <rect x="318" y="110" width="18" height="198" rx="2" fill="#4ade80"/>
    <line x1="327" y1="80" x2="327" y2="112" stroke="#4ade80" stroke-width="2"/>

    <rect x="295" y="140" width="18" height="168" rx="2" fill="#22c55e"/>
    <line x1="304" y1="105" x2="304" y2="142" stroke="#22c55e" stroke-width="2"/>

    <!-- Smaller candles behind -->
    <rect x="268" y="175" width="14" height="133" rx="1" fill="#15803d" opacity="0.7"/>
    <line x1="275" y1="152" x2="275" y2="177" stroke="#15803d" stroke-width="1.5" opacity="0.7"/>

    <rect x="248" y="200" width="14" height="108" rx="1" fill="#16a34a" opacity="0.7"/>
    <line x1="255" y1="178" x2="255" y2="202" stroke="#16a34a" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Green glow overlay -->
  <rect width="480" height="380" fill="url(#greenGlow)"/>
  <rect width="480" height="380" fill="url(#purpleGlow)"/>

  <!-- Floating gain % text (like sparks/embers) -->
  <text x="350" y="50" font-family="monospace" font-size="11" fill="#4ade80" opacity="0.7">+2,847%</text>
  <text x="375" y="88" font-family="monospace" font-size="9" fill="#22c55e" opacity="0.5">+481%</text>
  <text x="348" y="130" font-family="monospace" font-size="9" fill="#4ade80" opacity="0.4">+∞%</text>
  <text x="294" y="95" font-family="monospace" font-size="9" fill="#22c55e" opacity="0.5">100x</text>

  <!-- === ROUND TABLE === -->
  <!-- Table top (ellipse for 3D feel) -->
  <ellipse cx="185" cy="308" rx="85" ry="14" fill="#1c0030"/>
  <rect x="100" y="296" width="170" height="14" fill="#1c0030" rx="3"/>
  <!-- Table leg -->
  <rect x="178" y="320" width="14" height="34" fill="#180028" rx="2"/>
  <!-- Table edge highlight -->
  <ellipse cx="185" cy="296" rx="85" ry="6" fill="none" stroke="#3d005e" stroke-width="1.5"/>

  <!-- Coffee/tea mug on table -->
  <rect x="216" y="274" width="24" height="22" rx="4" fill="#160024"/>
  <rect x="217" y="275" width="22" height="20" rx="3" fill="#1e0032"/>
  <!-- mug handle -->
  <path d="M240 279 Q250 279 250 285 Q250 291 240 291" stroke="#6d28d9" stroke-width="2" fill="none"/>
  <!-- mug liquid surface -->
  <ellipse cx="228" cy="276" rx="10" ry="3" fill="#2e0048"/>
  <!-- steam lines -->
  <path d="M222 271 Q224 264 221 258" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M228 270 Q230 263 228 256" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M234 271 Q237 264 234 258" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- === DOG CHARACTER === -->

  <!-- Body -->
  <ellipse cx="185" cy="265" rx="46" ry="36" fill="#9333ea"/>

  <!-- Shirt collar detail -->
  <path d="M165 238 Q185 248 205 238" stroke="#7c3aed" stroke-width="2" fill="none"/>

  <!-- Arms/paws resting on table -->
  <!-- Left arm -->
  <path d="M145 280 Q148 295 155 302 Q165 308 175 305" stroke="#9333ea" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M225 280 Q222 295 215 302 Q205 308 195 305" stroke="#9333ea" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Paw toes (left) -->
  <circle cx="163" cy="304" r="5" fill="#a855f7"/>
  <circle cx="171" cy="306" r="5" fill="#a855f7"/>
  <circle cx="179" cy="306" r="5" fill="#a855f7"/>
  <!-- Paw toes (right) -->
  <circle cx="207" cy="306" r="5" fill="#a855f7"/>
  <circle cx="199" cy="307" r="5" fill="#a855f7"/>
  <circle cx="191" cy="307" r="5" fill="#a855f7"/>

  <!-- Neck -->
  <rect x="170" y="240" width="30" height="22" rx="8" fill="#9333ea"/>

  <!-- Head (main circle) -->
  <circle cx="185" cy="195" r="42" fill="#c084fc"/>

  <!-- Ears (floppy, hanging) -->
  <!-- Left ear -->
  <ellipse cx="152" cy="188" rx="16" ry="22" fill="#a855f7" transform="rotate(-8 152 188)"/>
  <ellipse cx="152" cy="190" rx="9" ry="14" fill="#c084fc" transform="rotate(-8 152 190)"/>
  <!-- Right ear -->
  <ellipse cx="218" cy="188" rx="16" ry="22" fill="#a855f7" transform="rotate(8 218 188)"/>
  <ellipse cx="218" cy="190" rx="9" ry="14" fill="#c084fc" transform="rotate(8 218 190)"/>

  <!-- Snout -->
  <ellipse cx="185" cy="210" rx="20" ry="15" fill="#ddd6fe"/>

  <!-- Nose -->
  <ellipse cx="185" cy="202" rx="6" ry="4.5" fill="#4c1d95"/>

  <!-- Nostrils -->
  <circle cx="182" cy="203" r="1.5" fill="#3b0764"/>
  <circle cx="188" cy="203" r="1.5" fill="#3b0764"/>

  <!-- Mouth — calm slight smile -->
  <path d="M177 213 Q185 219 193 213" stroke="#6d28d9" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes — half-lidded calm expression -->
  <!-- Left eye -->
  <circle cx="170" cy="187" r="7" fill="#1e1b4b"/>
  <circle cx="172" cy="185" r="2.5" fill="white"/>
  <!-- Calm upper lid covering top half -->
  <path d="M163 184 Q170 180 177 184" stroke="#9333ea" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Right eye -->
  <circle cx="200" cy="187" r="7" fill="#1e1b4b"/>
  <circle cx="202" cy="185" r="2.5" fill="white"/>
  <path d="M193 184 Q200 180 207 184" stroke="#9333ea" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- === SPEECH BUBBLE === -->
  <ellipse cx="95" cy="128" rx="78" ry="36" fill="white"/>
  <!-- bubble tail pointing to dog head -->
  <polygon points="135,158 148,175 115,162" fill="white"/>
  <!-- bubble border -->
  <ellipse cx="95" cy="128" rx="78" ry="36" fill="none" stroke="#e9d5ff" stroke-width="1"/>

  <!-- "this is fine" text -->
  <text x="95" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">this is fine</text>
  <text x="95" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#7c3aed">everything is fine 📈</text>

  <!-- sol.new watermark -->
  <text x="14" y="370" font-family="monospace" font-size="11" fill="#7c3aed" opacity="0.5">sol.new</text>
</svg>
