name: sol-new
options:
  bundleIdPrefix: xyz.solnew
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: "4CK2SMVS2Y"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  sol-new:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: sol-new
    entitlements:
      path: sol-new/sol-new.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:sol.new
          - applinks:sol.new
          - appclips:sol.new
        aps-environment: production
        com.apple.developer.nfc.readersession.formats:
          - NDEF
          - TAG
    info:
      path: sol-new/Info.plist
      properties:
        CFBundleDisplayName: sol.new
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: sol.new uses Face ID to authenticate your passkey-secured wallet.
        NSPhotoLibraryUsageDescription: sol.new uses photos so you can pick an image for your token, NFT, or profile.
        NSPhotoLibraryAddUsageDescription: sol.new can save QR codes and receipts to your photo library.
        NFCReaderUsageDescription: sol.new uses NFC to open links and experiences from tags.
        LSApplicationQueriesSchemes:
          - solana
          - phantom
          - solflare
          - mailto
          - tel
          - sms
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.solnew.app
        PRODUCT_NAME: sol-new
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - target: sol-new Clip
        embed: true

  sol-new Clip:
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Clip
        excludes:
          - README.md
    entitlements:
      path: Clip/Clip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)xyz.solnew.app
        com.apple.developer.associated-domains:
          - appclips:sol.new
          - applinks:sol.new
        com.apple.developer.nfc.readersession.formats:
          - NDEF
          - TAG
    info:
      path: Clip/Info.plist
      properties:
        CFBundleDisplayName: sol.new
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: black
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        NFCReaderUsageDescription: sol.new uses NFC to open links and experiences from tags.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.solnew.app.Clip
        PRODUCT_NAME: sol-new Clip
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
